name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify Windows shortcuts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows/create_shortcuts.ps1
          foreach ($name in @("Start Book My Date.lnk", "Setup Book My Date.lnk")) {
            if (-not (Test-Path $name)) { throw "Missing $name" }
          }

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run lint
        run: python -m ruff check .

      - name: Compile sources
        run: python -m compileall -q book_my_date installer launcher.py packaging

      - name: Build native release
        run: python packaging/build.py

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: book-my-date-${{ runner.os }}
          path: release/*
          if-no-files-found: error
